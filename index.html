  <script>
    const appId = 'financas-gustavo-isaias-nuvem-v3';
    const hojeISO = new Date().toISOString().slice(0, 10);
    const mesAtualPadrao = hojeISO.slice(0, 7);

    const dbPadrao = {
      usuarios: [
        { email: 'gustavo@email.com', senha: '1234', nome: 'Gustavo' },
        { email: 'isaias@email.com', senha: '1234', nome: 'Isaias' }
      ],
      receitas: [],
      categorias: [
        { usuario: 'Gustavo', nome: 'Alimentação', meta: 1000 },
        { usuario: 'Gustavo', nome: 'Transporte', meta: 500 },
        { usuario: 'Isaias', nome: 'Alimentação', meta: 1000 },
        { usuario: 'Isaias', nome: 'Moradia', meta: 1500 }
      ],
      cartoes: [
        { nome: 'Nubank', titular: 'Gustavo', fechamento: '5', vencimento: '12' },
        { nome: 'Itaú', titular: 'Isaias', fechamento: '10', vencimento: '17' }
      ],
      despesas: []
    };

    let dbSalvoLocal = null;
    try {
      const localStr = localStorage.getItem('painel_financeiro_gi_local_v3');
      if (localStr) dbSalvoLocal = JSON.parse(localStr);
    } catch(e) {}

    let db = dbSalvoLocal || JSON.parse(JSON.stringify(dbPadrao));
    let usuarioAtual = "";
    let chartInstancia = null;
    let chartComparativoInstancia = null;

    const FIREBASE_CONFIG = {
      projectId: "painel-financeiro-c8281"
    };

    const firestoreRestUrl = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/artifacts/${appId}/public/dados_gerais`;

    async function inicializarNuvem() {
      const statusEl = document.getElementById('status-sync');
      if (statusEl) statusEl.innerText = 'Conectando Nuvem...';

      try {
        const response = await fetch(firestoreRestUrl);
        if (response.ok) {
          const data = await response.json();
          if (data && data.fields) {
            db = deserializarFirestore(data.fields);
            salvarBackupLocal();
          } else {
            await salvarNaNuvemDireto();
          }
          if (statusEl) statusEl.innerText = 'Sincronizado na Nuvem';
          if (usuarioAtual) window.renderizarPainel();
        } else if (response.status === 404) {
          await salvarNaNuvemDireto();
          if (statusEl) statusEl.innerText = 'Sincronizado na Nuvem';
        } else {
          throw new Error("Falha HTTP");
        }
      } catch (e) {
        console.warn("Modo Local ativo devido a restrição de rede:", e);
        if (statusEl) statusEl.innerText = 'Modo Local (Seguro)';
      }
    }

    async function salvarNaNuvemDireto() {
      try {
        const payload = { fields: serializarFirestore(db) };
        await fetch(firestoreRestUrl, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn("Erro ao persistir na nuvem:", err);
      }
    }

    function serializarFirestore(obj) {
      if (typeof obj === 'string') return { stringValue: obj };
      if (typeof obj === 'number') return { doubleValue: obj };
      if (Array.isArray(obj)) return { arrayValue: { values: obj.map(item => serializarFirestore(item)) } };
      if (obj !== null && typeof obj === 'object') {
        let fields = {};
        for (let key in obj) {
          fields[key] = serializarFirestore(obj[key]);
        }
        return { mapValue: { fields: fields } };
      }
      return { stringValue: String(obj) };
    }

    function deserializarFirestore(fields) {
      let obj = {};
      for (let key in fields) {
        const valObj = fields[key];
        if ('stringValue' in valObj) obj[key] = valObj.stringValue;
        else if ('doubleValue' in valObj) obj[key] = valObj.doubleValue;
        else if ('integerValue' in valObj) obj[key] = Number(valObj.integerValue);
        else if ('booleanValue' in valObj) obj[key] = valObj.booleanValue;
        else if ('arrayValue' in valObj) {
          obj[key] = (valObj.arrayValue.values || []).map(item => deserializarFirestore({ v: item }).v);
        } else if ('mapValue' in valObj) {
          obj[key] = deserializarFirestore(valObj.mapValue.fields || {});
        }
      }
      return obj;
    }

    function mostrarToast(mensagem) {
      const x = document.getElementById("toast");
      if (!x) return;
      x.innerText = mensagem;
      x.className = "show";
      setTimeout(() => { x.className = x.className.replace("show", ""); }, 2500);
    }

    function salvarBackupLocal() {
      try {
        localStorage.setItem('painel_financeiro_gi_local_v3', JSON.stringify(db));
      } catch(e) {}
    }

    function iniciarSistema() {
      salvarBackupLocal();
    }

    function salvarLocalmente() {
      salvarBackupLocal();
      const statusEl = document.getElementById('status-sync');
      if (statusEl) statusEl.innerText = 'Salvando na nuvem...';
      salvarNaNuvemDireto().then(() => {
        if (statusEl) statusEl.innerText = 'Sincronizado na Nuvem';
      }).catch(() => {
        if (statusEl) statusEl.innerText = 'Modo Local';
        mostrarToast("Salvo localmente com segurança!");
      });
    }

    window.alternarModoLogin = function(modo) {
      const btnLogin = document.getElementById('btn-tab-login');
      const btnCad = document.getElementById('btn-tab-cad');
      const divLogin = document.getElementById('form-login-div');
      const divCad = document.getElementById('form-cadastro-div');
      document.getElementById('login-erro').innerText = '';

      if (modo === 'login') {
        btnLogin.style.background = 'var(--accent-blue)';
        btnLogin.style.color = '#fff';
        btnCad.style.background = 'transparent';
        btnCad.style.color = 'var(--text-muted)';
        divLogin.style.display = 'block';
        divCad.style.display = 'none';
      } else {
        btnCad.style.background = 'var(--primary)';
        btnCad.style.color = '#fff';
        btnLogin.style.background = 'transparent';
        btnLogin.style.color = 'var(--text-muted)';
        divCad.style.display = 'block';
        divLogin.style.display = 'none';
      }
    };

    window.cadastrarNovoUsuario = function() {
      const nome = document.getElementById('cad-nome').value.trim();
      const email = document.getElementById('cad-email').value.trim();
      const senha = document.getElementById('cad-senha').value.trim();

      if (!nome || !email || !senha) {
        document.getElementById('login-erro').innerText = 'Preencha todos os campos!';
        return;
      }

      const existe = db.usuarios.find(u => u.email === email);
      if (existe) {
        document.getElementById('login-erro').innerText = 'Este e-mail já está cadastrado!';
        return;
      }

      db.usuarios.push({ email, senha, nome });
      db.categorias.push({ usuario: nome, nome: 'Geral', meta: 1000 });
      salvarLocalmente();

      mostrarToast('Cadastro realizado com sucesso!');
      window.alternarModoLogin('login');
      document.getElementById('login-email').value = email;
      document.getElementById('login-senha').value = '';
    };

    window.entrar = function() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value.trim();
      const user = db.usuarios.find(u => u.email === email && u.senha === senha);
      
      if (user) {
        usuarioAtual = user.nome;
        document.getElementById('nome-usuario').innerText = usuarioAtual;
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('painel-principal').style.display = 'block';
        document.getElementById('filtro-mes').value = mesAtualPadrao;
        document.getElementById('desp-data').value = hojeISO;
        window.renderizarPainel();
        mostrarToast(`Bem-vindo, ${usuarioAtual}!`);
      } else {
        document.getElementById('login-erro').innerText = 'E-mail ou senha incorretos!';
      }
    };

    window.sair = function() {
      usuarioAtual = "";
      document.getElementById('painel-principal').style.display = 'none';
      document.getElementById('tela-login').style.display = 'block';
    };

    window.mudarAba = function(idAba, btn) {
      iniciarSistema();
      document.querySelectorAll('.secao').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(idAba).classList.add('active');
      if (btn) btn.classList.add('active');
      
      if (idAba === 'aba-historico') window.renderizarHistoricoGeral();
      if (idAba === 'aba-cartoes') window.renderizarTabelaCartoesConfig();
      if (idAba === 'aba-metas') window.renderizarTabelaMetasConfig();
    };

    window.renderizarPainel = function() {
      iniciarSistema();
      const mesFiltro = document.getElementById('filtro-mes').value;
      
      let receitaObj = db.receitas.find(r => r.usuario === usuarioAtual && r.mes === mesFiltro);
      let receitaMes = receitaObj ? Number(receitaObj.valor) : 0;
      document.getElementById('rec-valor').value = receitaMes;

      let despesasMes = [];
      let compromissosFuturos = [];

      db.despesas.forEach(d => {
        let temPermissao = (d.quemGastou === usuarioAtual) || (d.titularCartao === usuarioAtual);
        if (temPermissao) {
          const isCompraTerceiro = (d.titularCartao === usuarioAtual && d.quemGastou !== usuarioAtual);
          const itemProcessado = {
            ...d,
            categoriaExibicao: isCompraTerceiro ? `Compras ${d.quemGastou}` : d.categoria,
            isCompraTerceiro: isCompraTerceiro
          };

          if (d.mesRef === mesFiltro) despesasMes.push(itemProcessado);
          if (d.totalParcelas > 1 && d.mesRef >= mesFiltro) compromissosFuturos.push(itemProcessado);
        }
      });

      let totalDespesas = despesasMes.reduce((acc, item) => acc + Number(item.valor), 0);
      let saldo = receitaMes - totalDespesas;

      document.getElementById('resumo-receita').innerText = `R$ ${receitaMes.toFixed(2)}`;
      document.getElementById('resumo-despesa').innerText = `R$ ${totalDespesas.toFixed(2)}`;
      document.getElementById('resumo-saldo').innerText = `R$ ${saldo.toFixed(2)}`;
      document.getElementById('resumo-saldo').style.color = saldo >= 0 ? 'var(--success)' : 'var(--danger)';

      let catsUser = db.categorias.filter(c => c.usuario === usuarioAtual);
      document.getElementById('desp-cat').innerHTML = catsUser.length 
        ? catsUser.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('')
        : `<option value="Geral">Geral</option>`;

      document.getElementById('desp-pagamento').innerHTML = `<option value="Dinheiro/Pix|Nenhum">Dinheiro / Pix</option>` + 
        db.cartoes.map(c => `<option value="${c.nome}|${c.titular}">${c.nome} (${c.titular})</option>`).join('');

      document.getElementById('tabela-parcelas').innerHTML = compromissosFuturos.map(p => {
        const badgeTerceiro = p.isCompraTerceiro ? `<br><span class="badge-compartilhado">🤝 Compra de ${p.quemGastou}</span>` : '';
        return `<tr>
          <td>${p.mesRef}</td>
          <td><strong>${p.descricao}</strong>${badgeTerceiro}</td>
          <td>${p.parcelaAtual}/${p.totalParcelas}</td>
          <td style="color:var(--danger); font-weight:600;">R$ ${Number(p.valor).toFixed(2)}</td>
        </tr>`;
      }).join('');

      renderizarMetasEGrafico(despesasMes, catsUser);
      renderizarAcertoCartoes(despesasMes);
      renderizarGraficoComparativo(mesFiltro, db.despesas.filter(d => (d.quemGastou === usuarioAtual || d.titularCartao === usuarioAtual)));
      window.renderizarHistoricoGeral();
    };

    function renderizarAcertoCartoes(despesasMes) {
      const cardAcerto = document.getElementById('card-acerto-cartoes');
      const conteudoAcerto = document.getElementById('conteudo-acerto-cartoes');
      if (!cardAcerto || !conteudoAcerto) return;

      let aReceberPorPessoa = {};
      let aPagarPorTitular = {};

      despesasMes.forEach(d => {
        const valor = Number(d.valor);
        if (d.titularCartao === usuarioAtual && d.quemGastou !== usuarioAtual) {
          aReceberPorPessoa[d.quemGastou] = (aReceberPorPessoa[d.quemGastou] || 0) + valor;
        }
        if (d.quemGastou === usuarioAtual && d.titularCartao && d.titularCartao !== 'Nenhum' && d.titularCartao !== usuarioAtual) {
          aPagarPorTitular[d.titularCartao] = (aPagarPorTitular[d.titularCartao] || 0) + valor;
        }
      });

      let htmlAcerto = '';
      for (const [pessoa, total] of Object.entries(aReceberPorPessoa)) {
        htmlAcerto += `<div style="display:flex; justify-content:space-between; align-items:center; background:#EBF5EE; padding:8px 10px; border-radius:8px; border:1px solid #C2E0CB;">
          <span style="font-size:12px; color:var(--text);">📥 <strong>${pessoa}</strong> deve te pagar:</span>
          <strong style="font-size:13px; color:var(--success);">R$ ${total.toFixed(2)}</strong>
        </div>`;
      }
      for (const [titular, total] of Object.entries(aPagarPorTitular)) {
        htmlAcerto += `<div style="display:flex; justify-content:space-between; align-items:center; background:#FDECEC; padding:8px 10px; border-radius:8px; border:1px solid #F5C2C2;">
          <span style="font-size:12px; color:var(--text);">📤 Você deve pagar <strong>${titular}</strong>:</span>
          <strong style="font-size:13px; color:var(--danger);">R$ ${total.toFixed(2)}</strong>
        </div>`;
      }

      if (htmlAcerto) {
        conteudoAcerto.innerHTML = htmlAcerto;
        cardAcerto.style.display = 'block';
      } else {
        cardAcerto.style.display = 'none';
      }
    }

    function renderizarMetasEGrafico(despesasMes, catsUser) {
      let gastosPorCat = {};
      despesasMes.forEach(d => {
        const catKey = d.categoriaExibicao || d.categoria;
        gastosPorCat[catKey] = (gastosPorCat[catKey] || 0) + Number(d.valor);
      });

      const listaMetasEl = document.getElementById('lista-metas');
      if (listaMetasEl) {
        listaMetasEl.innerHTML = catsUser.map(c => {
          let gasto = gastosPorCat[c.nome] || 0;
          let pct = c.meta > 0 ? Math.min((gasto / c.meta) * 100, 100) : 0;
          let cor = gasto > c.meta ? 'var(--danger)' : 'var(--primary)';
          return `<div style="margin-bottom: 10px;">
            <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px;">
              <strong>${c.nome}</strong>
              <span>R$ ${gasto.toFixed(2)} / Meta: R$ ${c.meta.toFixed(2)}</span>
            </div>
            <div class="progress-bg">
              <div class="progress-fill" style="width:${pct}%; background:${cor}; height: 6px;"></div>
            </div>
          </div>`;
        }).join('');
      }

      const canvasCat = document.getElementById('graficoCategorias');
      if (canvasCat) {
        const ctx = canvasCat.getContext('2d');
        if (chartInstancia) chartInstancia.destroy();
        chartInstancia = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(gastosPorCat),
            datasets: [{
              data: Object.values(gastosPorCat),
              backgroundColor: ['#3B4D3B', '#1E3A5F', '#C5B8A5', '#6B8E23', '#4A6FA5', '#D97706'],
              borderWidth: 1,
              borderColor: '#FAF9F6'
            }]
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 9 } } } }
          }
        });
      }
    }

    function renderizarGraficoComparativo(mesAtualStr, todasDespesas) {
      const canvasComp = document.getElementById('graficoComparativoMeses');
      if (!canvasComp) return;

      const [anoAtual, mesAtual] = mesAtualStr.split('-').map(Number);
      let labelsMeses = [];
      let valoresMeses = [];
      let backgroundColors = [];

      for (let i = -2; i <= 2; i++) {
        let m = mesAtual + i;
        let a = anoAtual;
        while (m > 12) { m -= 12; a++; }
        while (m < 1) { m += 12; a--; }

        let mesStrRef = `${a}-${m < 10 ? '0' + m : m}`;
        const dataRef = new Date(a, m - 1, 1);
        labelsMeses.push(dataRef.toLocaleString('pt-BR', { month: 'short', year: '2-digit' }).replace('.', ''));

        let totalDoMes = todasDespesas
          .filter(d => d.mesRef === mesStrRef)
          .reduce((acc, item) => acc + Number(item.valor), 0);
        
        valoresMeses.push(totalDoMes);
        backgroundColors.push(mesStrRef === mesAtualStr ? '#1E3A5F' : '#C5B8A5');
      }

      const ctxComp = canvasComp.getContext('2d');
      if (chartComparativoInstancia) chartComparativoInstancia.destroy();
      
      chartComparativoInstancia = new Chart(ctxComp, {
        type: 'bar',
        data: {
          labels: labelsMeses,
          datasets: [{ data: valoresMeses, backgroundColor: backgroundColors, borderRadius: 4 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
        }
      });
    }

    window.verificarCartao = function() {
      const val = document.getElementById('desp-pagamento').value;
      const box = document.getElementById('box-parcelas');
      if (box) box.style.display = val.startsWith('Dinheiro') ? 'none' : 'block';
    };

    window.registrarReceita = function() {
      const valor = Number(document.getElementById('rec-valor').value);
      const mes = document.getElementById('filtro-mes').value;
      
      let recIndex = db.receitas.findIndex(r => r.usuario === usuarioAtual && r.mes === mes);
      if (recIndex >= 0) db.receitas[recIndex].valor = valor;
      else db.receitas.push({ usuario: usuarioAtual, mes: mes, valor: valor });
      
      salvarLocalmente();
      window.renderizarPainel();
      mostrarToast("Receita salva!");
    };

    window.registrarDespesa = function() {
      const desc = document.getElementById('desp-desc').value.trim();
      const valorTotal = Number(document.getElementById('desp-valor').value);
      const dataCompra = document.getElementById('desp-data').value || hojeISO;
      const categoria = document.getElementById('desp-cat').value;
      const pagInfo = document.getElementById('desp-pagamento').value.split('|');
      const formaPagamento = pagInfo[0];
      const titularCartao = pagInfo[1];
      const totalParcelas = formaPagamento.startsWith('Dinheiro') ? 1 : Number(document.getElementById('desp-parcelas').value) || 1;

      if (!desc || isNaN(valorTotal) || valorTotal <= 0) {
        mostrarToast("Preencha descrição e valor válido!");
        return;
      }

      let mesRefInicial = dataCompra.slice(0, 7);

      if (!formaPagamento.startsWith('Dinheiro')) {
        let cartaoObj = db.cartoes.find(c => c.nome === formaPagamento);
        if (cartaoObj && cartaoObj.fechamento) {
          let diaCompra = parseInt(dataCompra.slice(8, 10));
          if (diaCompra >= Number(cartaoObj.fechamento)) {
            let [ano, mes] = mesRefInicial.split('-').map(Number);
            mes++;
            if (mes > 12) { mes = 1; ano++; }
            mesRefInicial = `${ano}-${mes < 10 ? '0' + mes : mes}`;
          }
        }
      }

      let valorParcela = valorTotal / totalParcelas;
      let [anoP, mesP] = mesRefInicial.split('-').map(Number);
      let compraGroupId = 'grp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

      for (let p = 1; p <= totalParcelas; p++) {
        let mesFormatado = `${anoP}-${mesP < 10 ? '0' + mesP : mesP}`;
        db.despesas.push({
          id: 'd_' + Date.now() + '_' + p + '_' + Math.random().toString(36).substr(2, 5),
          compraId: compraGroupId,
          quemGastou: usuarioAtual,
          titularCartao: titularCartao,
          descricao: desc,
          categoria: categoria,
          formaPagamento: formaPagamento,
          valor: valorParcela.toFixed(2),
          parcelaAtual: p,
          totalParcelas: totalParcelas,
          mesRef: mesFormatado
        });
        mesP++;
        if (mesP > 12) { mesP = 1; anoP++; }
      }

      salvarLocalmente();
      document.getElementById('desp-desc').value = '';
      document.getElementById('desp-valor').value = '';
      window.mudarAba('aba-visao', document.querySelectorAll('.tab-btn')[0]);
      window.renderizarPainel();
      mostrarToast("Gasto registrado!");
    };

    function pertenceMesmaCompra(itemA, itemB) {
      if (itemA.compraId && itemB.compraId) {
        return itemA.compraId === itemB.compraId;
      }
      return itemA.descricao === itemB.descricao &&
             itemA.totalParcelas === itemB.totalParcelas &&
             itemA.formaPagamento === itemB.formaPagamento &&
             itemA.quemGastou === itemB.quemGastou &&
             itemA.totalParcelas > 1;
    }

    window.renderizarHistoricoGeral = function() {
      iniciarSistema();
      const mesFiltro = document.getElementById('filtro-mes').value;
      const termo = (document.getElementById('filtro-busca').value || "").toLowerCase();
      const tbody = document.getElementById('tabela-historico-geral');
      if (!tbody) return;
      
      let minhasDespesas = db.despesas.filter(d => 
        (d.quemGastou === usuarioAtual || d.titularCartao === usuarioAtual) &&
        d.mesRef === mesFiltro
      ).map(d => {
        const isCompraTerceiro = (d.titularCartao === usuarioAtual && d.quemGastou !== usuarioAtual);
        return {
          ...d,
          categoriaExibicao: isCompraTerceiro ? `Compras ${d.quemGastou}` : d.categoria,
          isCompraTerceiro: isCompraTerceiro
        };
      });
      
      if (termo) {
        minhasDespesas = minhasDespesas.filter(d => 
          d.descricao.toLowerCase().includes(termo) || 
          d.categoriaExibicao.toLowerCase().includes(termo)
        );
      }

      if (minhasDespesas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:16px;">Nenhum lançamento encontrado neste mês.</td></tr>`;
        return;
      }

      tbody.innerHTML = minhasDespesas.map((d) => {
        const textoParcela = d.totalParcelas > 1 ? ` <span style="color:var(--accent-blue); font-weight:600;">(${d.parcelaAtual}/${d.totalParcelas})</span>` : '';
        const badgeTerceiro = d.isCompraTerceiro ? `<br><span class="badge-compartilhado">🤝 Compra de ${d.quemGastou}</span>` : '';
        return `<tr>
          <td>${d.mesRef}</td>
          <td><strong>${d.descricao}</strong>${textoParcela}<br><small style="color:var(--text-muted);">${d.categoriaExibicao} • ${d.formaPagamento}</small>${badgeTerceiro}</td>
          <td style="color:var(--danger); font-weight:600;">R$ ${Number(d.valor).toFixed(2)}</td>
          <td>
            <button onclick="window.abrirModalEdicao('${d.id}')" style="padding:4px 8px; font-size:11px; width:auto; min-height:auto; background:var(--accent-blue); margin-bottom:2px;">✏️</button>
            <button onclick="window.excluirDespesa('${d.id}')" style="padding:4px 8px; font-size:11px; width:auto; min-height:auto; background:var(--danger);">🗑️</button>
          </td>
        </tr>`;
      }).join('');
    };

    window.excluirDespesa = function(id) {
      const d = db.despesas.find(item => item.id === id);
      if (!d) return;
      
      document.getElementById('del-desp-id').value = d.id;
      const boxEscopo = document.getElementById('box-escopo-exclusao');
      const textoConfirm = document.getElementById('texto-confirm-exclusao');
      
      if (d.totalParcelas > 1) {
        boxEscopo.style.display = 'block';
        document.getElementById('del-desp-escopo').value = 'atual';
        textoConfirm.innerText = `Parcela ${d.parcelaAtual}/${d.totalParcelas} de "${d.descricao}". Como deseja excluir?`;
      } else {
        boxEscopo.style.display = 'none';
        textoConfirm.innerText = `Deseja realmente excluir "${d.descricao}"?`;
      }
      
      document.getElementById('modal-exclusao').style.display = 'flex';
    };

    window.fecharModalExclusao = function() {
      document.getElementById('modal-exclusao').style.display = 'none';
    };

    window.confirmarExclusaoDespesa = function() {
      const id = document.getElementById('del-desp-id').value;
      const alvo = db.despesas.find(item => item.id === id);
      if (!alvo) return;

      const escopo = alvo.totalParcelas > 1 ? document.getElementById('del-desp-escopo').value : 'atual';

      if (escopo === 'atual') {
        db.despesas = db.despesas.filter(d => d.id !== id);
      } else if (escopo === 'futuras') {
        db.despesas = db.despesas.filter(d => !(pertenceMesmaCompra(d, alvo) && d.parcelaAtual >= alvo.parcelaAtual));
      } else if (escopo === 'todas') {
        db.despesas = db.despesas.filter(d => !pertenceMesmaCompra(d, alvo));
      }

      salvarLocalmente();
      window.fecharModalExclusao();
      window.renderizarPainel();
      mostrarToast("Lançamento(s) excluído(s)!");
    };

    window.abrirModalEdicao = function(id) {
      const d = db.despesas.find(item => item.id === id);
      if (!d) return;
      document.getElementById('edit-desp-id').value = d.id;
      document.getElementById('edit-desp-desc').value = d.descricao;
      document.getElementById('edit-desp-valor').value = d.valor;

      const boxEscopo = document.getElementById('box-escopo-edicao');
      if (d.totalParcelas > 1) {
        boxEscopo.style.display = 'block';
        document.getElementById('edit-desp-escopo').value = 'atual';
      } else {
        boxEscopo.style.display = 'none';
      }

      const selCat = document.getElementById('edit-desp-cat');
      const catsUser = db.categorias.filter(c => c.usuario === usuarioAtual);
      selCat.innerHTML = catsUser.map(c => `<option value="${c.nome}" ${c.nome === d.categoria ? 'selected' : ''}>${c.nome}</option>`).join('');
      document.getElementById('modal-edicao').style.display = 'flex';
    };

    window.fecharModalEdicao = function() {
      document.getElementById('modal-edicao').style.display = 'none';
    };

    window.salvarEdicaoDespesa = function() {
      const id = document.getElementById('edit-desp-id').value;
      const desc = document.getElementById('edit-desp-desc').value.trim();
      const categoria = document.getElementById('edit-desp-cat').value;
      const valor = Number(document.getElementById('edit-desp-valor').value);

      if (!desc || isNaN(valor) || valor < 0) { mostrarToast("Dados inválidos!"); return; }

      const alvo = db.despesas.find(item => item.id === id);
      if (alvo) {
        const escopo = alvo.totalParcelas > 1 ? document.getElementById('edit-desp-escopo').value : 'atual';

        db.despesas.forEach(item => {
          let deveAtualizar = false;
          if (escopo === 'atual' && item.id === alvo.id) {
            deveAtualizar = true;
          } else if (escopo === 'futuras' && pertenceMesmaCompra(item, alvo) && item.parcelaAtual >= alvo.parcelaAtual) {
            deveAtualizar = true;
          } else if (escopo === 'todas' && pertenceMesmaCompra(item, alvo)) {
            deveAtualizar = true;
          }

          if (deveAtualizar) {
            item.descricao = desc;
            item.categoria = categoria;
            item.valor = valor.toFixed(2);
          }
        });

        salvarLocalmente();
        window.fecharModalEdicao();
        window.renderizarPainel();
        mostrarToast("Atualizado com sucesso!");
      }
    };

    window.renderizarTabelaCartoesConfig = function() {
      iniciarSistema();
      const tbody = document.getElementById('tabela-cartoes-config');
      if (!tbody) return;
      tbody.innerHTML = db.cartoes.map((c, idx) => `<tr>
        <td><strong>${c.nome}</strong></td>
        <td>${c.titular}</td>
        <td>F:${c.fechamento || '-'} / V:${c.vencimento || '-'}</td>
        <td>
          <button onclick="window.editarCartao(${idx})" style="padding:2px 6px; font-size:10px; width:auto; min-height:auto; background:var(--accent-blue);">✏️</button>
          <button onclick="window.excluirCartao(${idx})" style="padding:2px 6px; font-size:10px; width:auto; min-height:auto; background:var(--danger);">🗑️</button>
        </td>
      </tr>`).join('');
    };

    window.registrarCartao = function() {
      const nome = document.getElementById('cart-nome').value.trim();
      const titular = document.getElementById('cart-titular').value;
      const fechamento = document.getElementById('cart-fechamento').value;
      const vencimento = document.getElementById('cart-vencimento').value;
      const editIdx = Number(document.getElementById('cart-edit-idx').value);

      if (!nome) { mostrarToast("Informe o nome!"); return; }

      if (editIdx >= 0) {
        db.cartoes[editIdx] = { nome, titular, fechamento, vencimento };
        window.cancelarEdicaoCartao();
      } else {
        db.cartoes.push({ nome, titular, fechamento, vencimento });
        document.getElementById('cart-nome').value = '';
      }
      salvarLocalmente();
      window.renderizarTabelaCartoesConfig();
      mostrarToast("Cartão salvo!");
    };

    window.editarCartao = function(idx) {
      const c = db.cartoes[idx];
      document.getElementById('cart-nome').value = c.nome;
      document.getElementById('cart-titular').value = c.titular;
      document.getElementById('cart-fechamento').value = c.fechamento || '';
      document.getElementById('cart-vencimento').value = c.vencimento || '';
      document.getElementById('cart-edit-idx').value = idx;
      document.getElementById('titulo-form-cartao').innerText = "✏️ Editar Cartão";
      document.getElementById('btn-salvar-cartao').innerText = "Salvar";
      document.getElementById('btn-cancelar-cartao').style.display = 'block';
    };

    window.cancelarEdicaoCartao = function() {
      document.getElementById('cart-nome').value = '';
      document.getElementById('cart-fechamento').value = '';
      document.getElementById('cart-vencimento').value = '';
      document.getElementById('cart-edit-idx').value = '-1';
      document.getElementById('titulo-form-cartao').innerText = "💳 Novo Cartão";
      document.getElementById('btn-salvar-cartao').innerText = "Salvar Cartão";
      document.getElementById('btn-cancelar-cartao').style.display = 'none';
    };

    window.excluirCartao = function(idx) {
      db.cartoes.splice(idx, 1);
      salvarLocalmente();
      window.renderizarTabelaCartoesConfig();
      mostrarToast("Cartão removido!");
    };

    window.renderizarTabelaMetasConfig = function() {
      iniciarSistema();
      const tbody = document.getElementById('tabela-metas-config');
      if (!tbody) return;
      const catsUser = db.categorias.map((c, idx) => ({ ...c, originalIdx: idx })).filter(c => c.usuario === usuarioAtual);
      
      tbody.innerHTML = catsUser.map((c) => `<tr>
        <td><strong>${c.nome}</strong></td>
        <td>R$ ${Number(c.meta).toFixed(2)}</td>
        <td>
          <button onclick="window.editarCategoria(${c.originalIdx})" style="padding:2px 6px; font-size:10px; width:auto; min-height:auto; background:var(--accent-blue);">✏️</button>
          <button onclick="window.excluirCategoria(${c.originalIdx})" style="padding:2px 6px; font-size:10px; width:auto; min-height:auto; background:var(--danger);">🗑️</button>
        </td>
      </tr>`).join('');
    };

    window.registrarCategoria = function() {
      const nome = document.getElementById('cat-nome').value.trim();
      const meta = Number(document.getElementById('cat-meta').value);
      const editIdx = Number(document.getElementById('cat-edit-idx').value);

      if (!nome || isNaN(meta)) { mostrarToast("Preencha nome e meta!"); return; }

      if (editIdx >= 0) {
        db.categorias[editIdx] = { usuario: usuarioAtual, nome, meta };
        window.cancelarEdicaoCategoria();
      } else {
        db.categorias.push({ usuario: usuarioAtual, nome, meta });
        document.getElementById('cat-nome').value = '';
        document.getElementById('cat-meta').value = '';
      }
      salvarLocalmente();
      window.renderizarTabelaMetasConfig();
      mostrarToast("Categoria salva!");
    };

    window.editarCategoria = function(idx) {
      const c = db.categorias[idx];
      document.getElementById('cat-nome').value = c.nome;
      document.getElementById('cat-meta').value = c.meta;
      document.getElementById('cat-edit-idx').value = idx;
      document.getElementById('titulo-form-cat').innerText = "✏️ Editar Categoria";
      document.getElementById('btn-salvar-cat').innerText = "Salvar";
      document.getElementById('btn-cancelar-cat').style.display = 'block';
    };

    window.cancelarEdicaoCategoria = function() {
      document.getElementById('cat-nome').value = '';
      document.getElementById('cat-meta').value = '';
      document.getElementById('cat-edit-idx').value = '-1';
      document.getElementById('titulo-form-cat').innerText = "🏷️ Nova Categoria";
      document.getElementById('btn-salvar-cat').innerText = "Salvar Categoria";
      document.getElementById('btn-cancelar-cat').style.display = 'none';
    };

    window.excluirCategoria = function(idx) {
      db.categorias.splice(idx, 1);
      salvarLocalmente();
      window.renderizarTabelaMetasConfig();
      mostrarToast("Categoria removida!");
    };

    inicializarNuvem();
  </script>
</body>
</html>
